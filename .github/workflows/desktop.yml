# 노트북용 Read Classic 설치 파일 만들기 (Windows 설치 파일 / Mac dmg / Linux zip)
# - 노트북용 코드(desktop/, server/)가 바뀌어 올라오거나 Actions 탭에서 Run workflow 로 실행하면
#   설치 파일을 만들고, 실제로 설치·실행해서 (인터넷을 막은 상태로) 예제 사진을 인식해 본다.
# - v* 태그를 올리거나 "release" 를 체크해서 실행하면 GitHub 릴리스에도 올린다.
#   릴리스의 파일 이름이 늘 같아서 .../releases/latest/download/<파일> 주소로 항상 최신판을 받을 수 있다.
name: Laptop app

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'GitHub 릴리스로 올리기'
        type: boolean
        default: false
  push:
    branches: ['**']
    tags: ['v*'] # 태그에는 아래 paths 가 적용되지 않는다
    paths:
      - 'desktop/**'
      - 'server/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            file: ReadClassic-Windows-Setup.exe
          - os: macos-latest # Apple Silicon (M1~)
            file: ReadClassic-Mac.dmg
          - os: ubuntu-22.04
            file: ReadClassic-Linux.zip
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1' # Windows 에서 한글 출력
      PYTHONIOENCODING: utf-8
      READ_CLASSIC_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r desktop/requirements.txt
      - name: 인식 모델 내려받기
        run: homr --init
      - name: Inno Setup 설치 (Windows 설치 파일 만들기용)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: 설치 파일 만들기
        shell: bash
        run: |
          export READ_CLASSIC_VERSION="${READ_CLASSIC_VERSION#v}"
          python desktop/build.py
          ls -la desktop/out

      # ---- 실제로 설치·실행해 보기 (인터넷 차단 흉내) ----
      - name: 'Windows: 설치 파일로 조용히 설치한 뒤 실행해 보기'
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -Wait -FilePath desktop\out\ReadClassic-Windows-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\ReadClassic\read-classic.exe'
          if (-not (Test-Path $exe)) { throw "설치된 실행 파일이 없습니다: $exe" }
          $desktop = [Environment]::GetFolderPath('Desktop')
          if (-not (Test-Path (Join-Path $desktop 'Read Classic.lnk'))) { throw '바탕화면 아이콘이 없습니다' }
          Write-Host '바탕화면 아이콘 있음'
          python desktop/smoke_test.py $exe
      - name: 'Mac: dmg 안의 앱 확인 후 실행해 보기'
        if: runner.os == 'macOS'
        run: |
          hdiutil attach desktop/out/ReadClassic-Mac.dmg -mountpoint /tmp/rc -nobrowse
          ls -la /tmp/rc
          test -x "/tmp/rc/Read Classic.app/Contents/MacOS/read-classic"
          test -L /tmp/rc/Applications
          python desktop/smoke_test.py "/tmp/rc/Read Classic.app/Contents/MacOS/read-classic"
          hdiutil detach /tmp/rc
      - name: 'Linux: 실행해 보기'
        if: runner.os == 'Linux'
        run: python desktop/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: desktop/out/${{ matrix.file }}
          compression-level: 0
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('laptop-{0}', github.run_number) }}
        run: |
          ls -la out
          gh release create "$TAG" out/ReadClassic-Windows-Setup.exe out/ReadClassic-Mac.dmg out/ReadClassic-Linux.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Read Classic 노트북용 $TAG" \
            --notes-file desktop/RELEASE_NOTES.md \
            --latest
