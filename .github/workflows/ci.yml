name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 서버 배선 시험에는 homr 자체가 필요 없다 (대역 스크립트 사용)
      - run: pip install "fastapi>=0.115,<1" "python-multipart>=0.0.9" httpx pytest
      - run: python -m pytest -q server/tests
